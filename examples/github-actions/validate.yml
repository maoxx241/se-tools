name: Validate public analysis tools
on: [push, pull_request]
jobs:
  portable-calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/export-analysis.mjs weights > /tmp/weights.json
      - run: node scripts/export-analysis.mjs communication > /tmp/communication.json
      - run: node scripts/export-analysis.mjs collective examples/hccl/alltoallv.json
      - run: python3 scripts/verify-archive.py
