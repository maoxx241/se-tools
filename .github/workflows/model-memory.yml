name: Validate model memory tools
on:
  push:
  pull_request:
jobs:
  portable-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm test
      - run: node scripts/export-analysis.mjs memory --spec examples/model-memory/synthetic.json > /tmp/synthetic-memory.json
      - run: npm run verify:memory
  native-recalculation:
    runs-on: ubuntu-latest
    needs: portable-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install LibreOffice Calc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: python3 scripts/verify-memory-native.py models/kimi-k3/kimi-k3-memory.xlsx
      - run: python3 scripts/verify-memory-native.py examples/model-memory/synthetic-hybrid/synthetic-hybrid-memory.xlsx --spec examples/model-memory/synthetic.json
